services:
  web:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - "6657:6657"
    volumes:
      - type: bind
        source: /opt/fatebook/site
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/fatebook/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /usr/share/nginx/html/index.html && wget -q -O /dev/null http://127.0.0.1:6657/healthz",
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
